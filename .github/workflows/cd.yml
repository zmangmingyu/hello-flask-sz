name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          set -e
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'DEPLOY'
          set -e

          APP="hello-flask-sz"
          DEPLOY_DIR="/opt/hello-flask-sz"
          PORT=8003
          PORT_MAX=8020
          HEALTHCHECK="/health"

          # 准备部署目录
          mkdir -p "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          # 写入应用文件（通过 heredoc）
          cat > app.py << 'APPEOF'
          from flask import Flask, jsonify

          app = Flask(__name__)

          @app.route("/")
          def index():
              return jsonify({"message": "Welcome to hello-flask-sz"})

          @app.route("/health")
          def health():
              return jsonify({"status": "ok"})

          if __name__ == "__main__":
              app.run(host="0.0.0.0", port=8003)
          APPEOF

          cat > requirements.txt << 'REQEOF'
          flask>=3.0,<4.0
          REQEOF

          cat > Dockerfile << 'DOCKEREOF'
          FROM python:3.11-slim
          ARG PIP_INDEX_URL=https://pypi.org/simple
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir --timeout 120 -i "${PIP_INDEX_URL}" -r requirements.txt
          COPY app.py .
          EXPOSE 8003
          CMD ["python", "app.py"]
          DOCKEREOF

          # 构建镜像
          docker build --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple -t "$APP":latest .

          # 端口自动回退
          port_in_use() {
            ss -ltnH 2>/dev/null | grep -q ":$1 " && return 0
            docker ps --format "{{.Ports}}" 2>/dev/null | grep -q ":$1->" && return 0
            return 1
          }
          HOST_PORT=""
          for p in $(seq $PORT $PORT_MAX); do
            if ! port_in_use "$p"; then HOST_PORT="$p"; break; fi
          done
          [ -z "$HOST_PORT" ] && { echo "预留端口区间已全部占用,部署中止"; exit 1; }
          echo ">> 部署到主机端口 $HOST_PORT"

          # 幂等替换旧容器
          docker rm -f "$APP" 2>/dev/null || true
          docker run -d --name "$APP" --restart unless-stopped -p ${HOST_PORT}:8003 "$APP":latest

          sleep 3
          curl -fsS "http://localhost:${HOST_PORT}${HEALTHCHECK}"
          echo ">> 部署成功: http://$(hostname -I | awk '{print $1}'):${HOST_PORT}${HEALTHCHECK}"
          DEPLOY

  build-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build (syntax check)
        run: docker build -t hello-flask-sz:latest .
